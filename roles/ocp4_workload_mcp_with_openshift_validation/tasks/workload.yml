---
# ==============================================================================
# Main Validation Tasks
# ==============================================================================

- name: Check if validation is enabled
  ansible.builtin.debug:
    msg: >-
      Validation is
      {{ 'enabled' if (ocp4_workload_mcp_with_openshift_validation_enabled | default(false) | bool) else 'disabled' }}
      -
      {{ 'proceeding' if (ocp4_workload_mcp_with_openshift_validation_enabled | default(false) | bool) else 'skipping' }}

- name: End play if validation is disabled
  ansible.builtin.meta: end_play
  when: not (ocp4_workload_mcp_with_openshift_validation_enabled | default(false) | bool)

- name: Initialize validation results list
  ansible.builtin.set_fact:
    _validation_results: []
    _validation_issues: []

- name: Display validation plan
  ansible.builtin.debug:
    msg: |
      ================================================
      MCP with OpenShift Workshop Validation Plan
      ================================================

      Users to validate: {{ ocp4_workload_mcp_with_openshift_validation_num_users }}
      User prefix: {{ ocp4_workload_mcp_with_openshift_validation_user_prefix }}

      Shared Components:
      - Gitea: {{ 'enabled' if ocp4_workload_mcp_with_openshift_validation_check_gitea | bool else 'disabled' }}
      - OpenShift GitOps: {{ 'enabled' if ocp4_workload_mcp_with_openshift_validation_check_openshift_gitops | bool else 'disabled' }}
      - OpenShift Pipelines: {{ 'enabled' if ocp4_workload_mcp_with_openshift_validation_check_openshift_pipelines | bool else 'disabled' }}
      - Toolhive: {{ 'enabled' if ocp4_workload_mcp_with_openshift_validation_check_toolhive | bool else 'disabled' }}

      Per-User Components:
      - LibreChat: {{ 'enabled' if ocp4_workload_mcp_with_openshift_validation_check_librechat | bool else 'disabled' }}
      - MCP OpenShift Server: {{ 'enabled' if ocp4_workload_mcp_with_openshift_validation_check_mcp_openshift | bool else 'disabled' }}
      - MCP Gitea Server: {{ 'enabled' if ocp4_workload_mcp_with_openshift_validation_check_mcp_gitea | bool else 'disabled' }}
      - Agent: {{ 'enabled' if ocp4_workload_mcp_with_openshift_validation_check_agent | bool else 'disabled' }}
      - Showroom: {{ 'enabled' if ocp4_workload_mcp_with_openshift_validation_check_showroom | bool else 'disabled' }}

      GitOps Validation:
      - ArgoCD Apps: {{ 'enabled' if ocp4_workload_mcp_with_openshift_validation_check_argocd_apps | bool else 'disabled' }}
      - Expected apps: {{
          ocp4_workload_mcp_with_openshift_validation_num_users | int
          * ocp4_workload_mcp_with_openshift_validation_argocd_apps_per_user }}

      ================================================

# ==============================================================================
# Shared Component Validation (run first)
# ==============================================================================

- name: Validate shared Gitea instance
  ansible.builtin.include_tasks: check_gitea.yml
  when: ocp4_workload_mcp_with_openshift_validation_check_gitea | bool

- name: Validate OpenShift GitOps
  ansible.builtin.include_tasks: check_openshift_gitops.yml
  when: ocp4_workload_mcp_with_openshift_validation_check_openshift_gitops | bool

- name: Validate OpenShift Pipelines
  ansible.builtin.include_tasks: check_openshift_pipelines.yml
  when: ocp4_workload_mcp_with_openshift_validation_check_openshift_pipelines | bool

- name: Validate Toolhive Operator
  ansible.builtin.include_tasks: check_toolhive.yml
  when: ocp4_workload_mcp_with_openshift_validation_check_toolhive | bool

# ==============================================================================
# GitOps Validation (run BEFORE per-user checks - wait for deployments)
# ==============================================================================

- name: Wait for Argo CD Applications to sync
  ansible.builtin.include_tasks: check_argocd_apps.yml
  when: ocp4_workload_mcp_with_openshift_validation_check_argocd_apps | bool

- name: Wait for pods to start after GitOps sync
  ansible.builtin.pause:
    seconds: 30
    prompt: "Waiting 30 seconds for pods to start after GitOps sync completes..."
  when: ocp4_workload_mcp_with_openshift_validation_check_argocd_apps | bool

# ==============================================================================
# Per-User Component Validation (run AFTER GitOps sync)
# ==============================================================================

- name: Validate per-user components
  ansible.builtin.include_tasks: check_user_components.yml
  loop: "{{ range(1, ocp4_workload_mcp_with_openshift_validation_num_users | int + 1) | list }}"
  loop_control:
    loop_var: _user_number

# ==============================================================================
# Generate Validation Report
# ==============================================================================

- name: Generate validation report
  ansible.builtin.include_tasks: generate_report.yml
